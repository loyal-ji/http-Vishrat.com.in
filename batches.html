<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOYAL — All Batches</title>
<meta name="description" content="LOYAL Learning Platform — all batches">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050816;
  color:#fff;
  font-family:Arial,sans-serif
}

header{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:#08102aee;
  border-bottom:1px solid #26345f
}

.brand{
  font-size:22px;
  font-weight:800;
  color:#00eaff
}

.btn,.chip,.open{
  border:1px solid #334577;
  background:#101936;
  color:#fff;
  border-radius:10px;
  padding:10px 13px;
  font-weight:700;
  cursor:pointer
}

.hero{
  text-align:center;
  padding:45px 16px;
  background:radial-gradient(circle at top,#172c65,#050816 65%)
}

h1{
  margin:0 0 10px;
  font-size:38px;
  background:linear-gradient(90deg,#00eaff,#7c4dff,#ff4ecd);
  -webkit-background-clip:text;
  color:transparent
}

.sub{
  color:#aeb9d8
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:22px 16px
}

.search{
  width:100%;
  padding:15px 18px;
  border-radius:30px;
  border:1px solid #334577;
  background:#0b1230;
  color:#fff;
  font-size:16px
}

.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:16px 0
}

.chip{
  white-space:nowrap
}

.chip.active{
  background:#00bcd4;
  color:#03101b
}

.section{
  margin:22px 0
}

.section h2{
  color:#00eaff
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:16px
}

.card{
  background:linear-gradient(145deg,#101936,#080d20);
  border:1px solid #26345f;
  border-radius:18px;
  padding:18px;
  transition:.2s
}

.card:hover{
  transform:translateY(-3px);
  border-color:#00eaff;
  box-shadow:0 0 18px rgba(0,234,255,.2)
}

/* ⭐ Batch Logo */
.icon{
  font-size:32px;
  min-height:70px
}

.batch-logo{
  width:68px;
  height:68px;
  object-fit:cover;
  border-radius:14px;
  display:block;
  border:1px solid #00eaff;
  box-shadow:
    0 0 6px #00eaff,
    0 0 15px rgba(0,234,255,.5)
}

.card h3{
  margin:10px 0
}

.desc{
  color:#9da9c9;
  font-size:13px;
  min-height:35px
}

.tag{
  display:inline-block;
  margin-top:8px;
  padding:5px 8px;
  border-radius:8px;
  background:#102d2b;
  color:#00ffb3;
  border:1px solid #00ffb3;
  font-size:11px
}

.open{
  width:100%;
  margin-top:14px;
  background:linear-gradient(90deg,#00bcd4,#7c4dff);
  border:0
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000d;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px
}

.box{
  width:100%;
  max-width:390px;
  background:#0b1230;
  border:1px solid #26345f;
  border-radius:20px;
  padding:22px
}

.box h2{
  text-align:center;
  color:#00eaff
}

.input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #334577;
  background:#101936;
  color:#fff
}

.msg{
  text-align:center;
  color:#ffcc00;
  min-height:22px
}

.close{
  width:100%;
  margin-top:9px;
  padding:11px;
  border-radius:10px;
  background:#101936;
  color:#fff;
  border:1px solid #334577
}

.phone{
  display:none
}

footer{
  text-align:center;
  color:#7783a8;
  padding:35px 15px
}

@media(max-width:600px){
  h1{
    font-size:30px
  }

  .brand{
    font-size:18px
  }

  .btn{
    padding:8px 9px
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">👑 LOYAL LEARNING</div>

  <div>
    <button class="btn" id="loginBtn" onclick="openLogin()">
      🔐 Login
    </button>

    <button class="btn" onclick="location.href='index.html'">
      🏠 Home
    </button>
  </div>
</header>

<section class="hero">
  <h1>All Batches • One Platform</h1>
  <div class="sub">
    Login करो → category चुनो → batch open करो 🚀
  </div>
</section>

<main class="wrap">

  <input
    id="search"
    class="search"
    placeholder="🔍 Batch, exam या subject search करो..."
    oninput="render()"
  >

  <div id="chips" class="chips"></div>

  <div id="catalog"></div>

</main>

<footer>
  LOYAL — Learn • Practice • Grow
</footer>

<div id="modal" class="modal">

  <div class="box">

    <h2>🔐 LOYAL Login</h2>

    <div id="emailBox">

      <input
        id="email"
        class="input"
        type="email"
        placeholder="📧 Email"
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="🔑 Password"
      >

      <button class="open" onclick="emailLogin()">
        📧 Login
      </button>

      <button class="close" onclick="showPhone()">
        📱 Mobile + OTP
      </button>

    </div>

    <div id="phoneBox" class="phone">

      <input
        id="phone"
        class="input"
        maxlength="10"
        inputmode="numeric"
        placeholder="📱 10 digit mobile"
      >

      <div id="recaptcha-container"></div>

      <button class="open" onclick="sendOTP()">
        📲 Send OTP
      </button>

      <input
        id="otp"
        class="input"
        maxlength="6"
        inputmode="numeric"
        placeholder="🔢 6 digit OTP"
        style="display:none"
      >

      <button
        id="verify"
        class="open"
        onclick="verifyOTP()"
        style="display:none"
      >
        ✅ Verify OTP
      </button>

      <button class="close" onclick="showEmail()">
        📧 Email + Password
      </button>

    </div>

    <button class="close" onclick="closeLogin()">
      ✕ Close
    </button>

    <div id="msg" class="msg"></div>

  </div>

</div>

];

let active='All',
    user=null,
    confirmationResult=null,
    recaptchaVerifier=null;

function render(){

  document.getElementById('chips').innerHTML=
    Object.entries(cats).map(([k,v])=>
      `<button class="chip ${active===k?'active':''}"
      onclick="active='${k}';render()">
      ${v} ${k}
      </button>`
    ).join('');

  const q=document
    .getElementById('search')
    .value
    .toLowerCase();

  const a=courses.filter(c=>
    (active==='All'||c[0]===active)&&
    c.join(' ').toLowerCase().includes(q)
  );

  const g={};

  a.forEach(c=>
    (g[c[0]]??=[]).push(c)
  );

  document.getElementById('catalog').innerHTML=
    Object.entries(g).map(([cat,items])=>

      `<section class="section">
        <h2>${cats[cat]} ${cat}</h2>

        <div class="grid">

          ${
            items.map(c=>`

              <article class="card">

                <div class="icon">

                  ${
                    c[1].endsWith('.png')
                    ?
                    `<img
                      class="batch-logo"
                      src="${c[1]}"
                      alt="${c[2]}"
                    >`
                    :
                    c[1]
                  }

                </div>

                <span class="tag">
                  FREE AFTER LOGIN
                </span>

                <h3>${c[2]}</h3>

                <div class="desc">
                  ${c[3]}
                </div>

                <button
                  class="open"
                  onclick="openCourse(
                    '${c[4]}',
                    '${c[5]}',
                    '${c[2]}'
                  )"
                >
                  🔓 Open Batch
                </button>

              </article>

            `).join('')
          }

        </div>
      </section>`

    ).join('') ||
    '<p>कोई batch नहीं मिला.</p>';
}

function openLogin(){
  modal.style.display='flex';
  msg.innerText=''
}

function closeLogin(){
  modal.style.display='none'
}

function showPhone(){
  emailBox.style.display='none';
  phoneBox.style.display='block';
  setupRecaptcha()
}

function showEmail(){
  phoneBox.style.display='none';
  emailBox.style.display='block'
}

function msg(t){
  document.getElementById('msg').innerText=t
}

async function openCourse(batch,url,name){

  if(!user){
    openLogin();
    msg('🔐 पहले Login करो');
    return
  }

  try{

    const token=await user.getIdToken(true);

    const r=await fetch(
      BACKEND+'/api/access/'+
      encodeURIComponent(batch),
      {
        headers:{
          Authorization:'Bearer '+token,
          Accept:'application/json'
        },
        cache:'no-store'
      }
    );

    const d=await r.json();

    if(d.allowed){
      location.href=
        url+
        (url==='batch.html'
        ?'?batch='+encodeURIComponent(name)
        :'');
      return
    }

    msg('⚠️ Access नहीं मिला');

  }catch(e){

    console.error(e);
    msg('⚠️ Server connection नहीं हुआ')

  }
}

async function emailLogin(){

  try{

    msg('⏳ Login हो रहा है...');

    await window.firebaseEmail(
      email.value.trim(),
      password.value
    );

    msg('✅ Login सफल');

    setTimeout(closeLogin,500)

  }catch(e){

    console.error(e);
    msg('❌ Login failed')

  }
}

function setupRecaptcha(){

  if(recaptchaVerifier)return;

  try{

    recaptchaVerifier=
      new window.FirebaseRecaptcha(
        window.FirebaseAuth,
        'recaptcha-container',
        {
          size:'invisible',
          callback:()=>{}
        }
      );

  }catch(e){

    console.error(e)

  }
}

async function sendOTP(){

  const p=phone.value.trim();

  if(!/^\d{10}$/.test(p)){
    msg('⚠️ 10 digit mobile number डालो');
    return
  }

  try{

    setupRecaptcha();

    confirmationResult=
      await window.FirebasePhone(
        window.FirebaseAuth,
        '+91'+p,
        recaptchaVerifier
      );

    otp.style.display='block';
    verify.style.display='block';

    msg('✅ OTP भेज दिया गया');

  }catch(e){

    console.error(e);
    msg('❌ OTP नहीं भेजा गया')

  }
}

async function verifyOTP(){

  try{

    await confirmationResult.confirm(
      otp.value.trim()
    );

    msg('✅ Mobile Login सफल');

    setTimeout(closeLogin,500)

  }catch(e){

    console.error(e);
    msg('❌ OTP गलत है')

  }
}

render();

</script>
